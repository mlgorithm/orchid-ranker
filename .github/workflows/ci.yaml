name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # A tagged release calls this exact suite before publication, so pull
  # requests and releases are held to the same validation standard.
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src/orchid_ranker
      - name: Test
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pytest tests -q --cov=orchid_ranker --cov-fail-under=75
          else
            python -m pytest tests -q
          fi
      - name: Documentation
        run: python -m mkdocs build --strict

  package:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/orchid-wheel
          /tmp/orchid-wheel/bin/python -m pip install --upgrade pip
          /tmp/orchid-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/orchid-wheel/bin/python -c "import importlib.metadata as md; import orchid_ranker; from orchid_ranker import AdaptiveRanker; assert orchid_ranker.__version__ == md.version('orchid-ranker'); assert AdaptiveRanker"

  platforms:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Core regression suite
        run: python -m pytest tests/test_publish_readiness.py tests/test_single_public_api.py tests/test_serving_safety.py -q

  lower-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install declared lower bounds
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.23.5" "pandas==1.5.3" "scikit-learn==1.2.0" "scipy==1.9.3" "torch==2.0.0"
          python -m pip install --no-deps .
          python -m pip install "pytest>=7.0,<9"
      - name: Verify lower-bound install
        run: python -m pytest tests/test_publish_readiness.py tests/test_single_public_api.py -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit resolved dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install ".[dev]"
          python -m pip_audit --strict
