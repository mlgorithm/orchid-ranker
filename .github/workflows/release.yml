name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Release preflight
        run: |
          python - <<'PY'
          import importlib.metadata
          import tomllib
          from pathlib import Path

          from packaging.version import Version

          import orchid_ranker

          tag_version = "${{ github.ref_name }}".removeprefix("v")
          project_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          package_version = importlib.metadata.version("orchid-ranker")
          versions = {tag_version, project_version, package_version, orchid_ranker.__version__}
          if len(versions) != 1:
              raise SystemExit(
                  "release version mismatch: "
                  f"tag={tag_version}, pyproject={project_version}, "
                  f"metadata={package_version}, __version__={orchid_ranker.__version__}"
              )
          version = Version(project_version)
          if version.is_prerelease or version.is_devrelease or version.local:
              raise SystemExit(
                  "tagged releases must use a final public version; "
                  f"got {project_version!r}"
              )
          PY
          python -m pytest tests/test_publish_readiness.py -q

  full-validation:
    name: Full release validation
    needs: release-preflight
    uses: ./.github/workflows/ci.yaml

  build:
    needs: full-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke-test a clean wheel install
        run: |
          python -m venv /tmp/orchid-wheel
          /tmp/orchid-wheel/bin/python -m pip install --upgrade pip
          /tmp/orchid-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/orchid-wheel/bin/python -c "import importlib.metadata as md; import orchid_ranker; from orchid_ranker import AdaptiveRanker; assert orchid_ranker.__version__ == md.version('orchid-ranker'); assert AdaptiveRanker"

      - name: Smoke-test a clean source install
        run: |
          python -m venv /tmp/orchid-sdist
          /tmp/orchid-sdist/bin/python -m pip install --upgrade pip
          /tmp/orchid-sdist/bin/python -m pip install dist/*.tar.gz
          cd /tmp
          /tmp/orchid-sdist/bin/python -c "import importlib.metadata as md; import orchid_ranker; from orchid_ranker import AdaptiveRanker; assert orchid_ranker.__version__ == md.version('orchid-ranker'); assert AdaptiveRanker"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: orchid-ranker-sbom.spdx.json
          output-file: dist/orchid-ranker-sbom.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/orchid-ranker-sbom.spdx.json

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/orchid-ranker
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    needs: [build, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install mkdocs-material mkdocstrings[python] mike

      - name: Deploy versioned docs
        run: |
          git fetch origin gh-pages --depth=1 || true
          VERSION=${GITHUB_REF_NAME#v}
          mike deploy --push --update-aliases $VERSION latest
