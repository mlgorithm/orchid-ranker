name: Documentation issue
description: Report unclear, incomplete, or incorrect documentation.
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Orchid Ranker easier to use. Please do not post
        private learner data, credentials, or security-vulnerability details.
  - type: input
    id: page
    attributes:
      label: Page or file
      description: Link to the documentation page or name the repository file.
      placeholder: "For example: docs/quickstart.md"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: A proposed wording or example is helpful but optional.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true

