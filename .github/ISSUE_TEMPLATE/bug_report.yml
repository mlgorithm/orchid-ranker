name: Bug report
description: Report a reproducible problem with Orchid Ranker.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Orchid Ranker. Do not include credentials,
        learner data, or other confidential information. For a vulnerability,
        follow the repository security policy instead of filing a public issue.
  - type: input
    id: version
    attributes:
      label: Orchid Ranker version
      description: Include the installed package version and how it was installed.
      placeholder: "For example: 1.0.0 from PyPI"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: "For example: Python 3.12.3 on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest self-contained example that demonstrates the problem.
      placeholder: |
        import pandas as pd
        from orchid_ranker import AdaptiveRanker

        # Minimal data and call that triggers the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and traceback
      description: Remove private data, tokens, and filesystem paths that should not be public.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I removed confidential and personally identifiable information.
          required: true

