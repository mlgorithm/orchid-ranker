site_name: Orchid Ranker
site_description: Outcome-driven adaptive recommender with one fit, recommend, and observe workflow.
site_url: https://mlgorithm.github.io/orchid-ranker/
repo_url: https://github.com/mlgorithm/orchid-ranker
repo_name: mlgorithm/orchid-ranker
edit_uri: edit/main/docs/
exclude_docs: |
  README.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - How Orchid works: overview.md
  - Guides:
    - Fit historical outcomes: guides/01-fit-offline.md
    - Production serving: guides/02-serve-streaming.md
    - Reference pilots: examples.md
  - API: api_reference.md
  - Validate a rollout: benchmarks/credibility.md
  - Contributing:
    - Contribution guide: contributing.md
    - Coding standards: coding-standards.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

extra:
  version:
    provider: mike
