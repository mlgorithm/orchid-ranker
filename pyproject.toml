[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchid-ranker"
version = "0.7.0.dev0"
description = "Outcome-driven adaptive recommender that learns what to choose next."
readme = "README.md"
authors = [
  {name = "Sam Urmian", email = "sam.urmian@gmail.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.23.5",
  "pandas>=1.5.3",
  "scikit-learn>=1.2",
  "scipy>=1.9.3",
  "torch>=2.0,<3",
]
keywords = [
  "adaptive-recommendation",
  "sequential-recommendation",
  "online-learning",
  "personalization",
  "adaptive-systems",
  "feedback-loops",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.5,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.24,<1",
  "pymdown-extensions>=10,<11",
]
dev = [
  "pytest>=7.0,<9",
  "pytest-cov>=5.0,<7",
  "mypy>=1.4,<2",
  "ruff>=0.1.5,<1",
  "mkdocs>=1.5,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.24,<1",
  "pymdown-extensions>=10,<11",
  "build>=1.0,<2",
  "twine>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/mlgorithm/orchid-ranker"
Source = "https://github.com/mlgorithm/orchid-ranker"
Documentation = "https://mlgorithm.github.io/orchid-ranker/"
Changelog = "https://github.com/mlgorithm/orchid-ranker/blob/main/CHANGELOG.md"
Issues = "https://github.com/mlgorithm/orchid-ranker/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
orchid_ranker = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["orchid_ranker", "orchid_ranker.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E701", "E702", "E741"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:The PyTorch API of nested tensors is in prototype stage.*:UserWarning",
]
